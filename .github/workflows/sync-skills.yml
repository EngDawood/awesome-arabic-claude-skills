name: Auto-Sync Arabic Skills Catalog

on:
  push:
    branches:
      - main
    paths:
      - 'skills/**'
      - 'sources.json'
      - 'scripts/**'
  workflow_dispatch:
  repository_dispatch:
    types: [sync-skills, upstream-update]
  schedule:
    - cron: '0 4 * * 1' # Run every Monday at 04:00 UTC

permissions:
  contents: write

concurrency:
  group: catalog-update
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Run Skills Validation and Auto-Sync
        run: |
          python scripts/sync_skills.py

      - name: Commit and Push Changes on Main
        run: |
          if [ -n "$(git status --porcelain)" ]; then
            git config --local user.email "github-actions[bot]@users.noreply.github.com"
            git config --local user.name "github-actions[bot]"
            git add -A skills/
            git add skills.json README.md README.en.md sources.json
            git commit -m "chore(skills): auto-sync skills catalog and upstream repositories [skip ci]"
            git push
          else
            echo "No catalog changes detected. Repository is up to date."
          fi
