name: Add Skill From Issue

on:
  issues:
    types: [labeled]

permissions:
  contents: write
  issues: write
  pull-requests: write

concurrency:
  group: catalog-update
  cancel-in-progress: false

jobs:
  add-skill:
    if: github.event.label.name == 'add-skill'
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
      ISSUE_NUMBER: ${{ github.event.issue.number }}
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Parse Issue and Register Skill
        env:
          ISSUE_BODY: ${{ github.event.issue.body }}
        run: python scripts/add_skill_from_issue.py

      - name: Auto-Sync Skills Catalog
        run: python scripts/sync_skills.py

      - name: Validate Catalog
        run: python scripts/check_catalog.py

      - name: Open Pull Request
        run: |
          scripts/open_catalog_pr.sh \
            "add-skill/issue-$ISSUE_NUMBER" \
            "feat(skills): add skill from issue #$ISSUE_NUMBER" \
            "Closes #$ISSUE_NUMBER"

      - name: Comment on Issue
        run: |
          url=$(gh pr view "add-skill/issue-$ISSUE_NUMBER" --json url -q .url 2>/dev/null || true)
          if [ -n "$url" ]; then
            gh issue comment "$ISSUE_NUMBER" --body "شكراً لمساهمتك! تم فتح طلب دمج للمراجعة: $url

          Thank you! A pull request is open for review: $url"
          else
            gh issue comment "$ISSUE_NUMBER" --body "هذه المهارة موجودة بالفعل في الفهرس.

          This skill is already in the catalog."
            gh issue close "$ISSUE_NUMBER"
          fi

      - name: Comment on Failure
        if: failure()
        run: |
          gh issue comment "$ISSUE_NUMBER" --body "تعذر التحقق من المهارة. راجع سجل التشغيل: $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID

          Could not validate the skill. See the run log: $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
