name: Add Skill From Issue

on:
  issues:
    types: [labeled]

permissions:
  contents: write
  issues: write
  pull-requests: write

jobs:
  add-skill:
    if: github.event.label.name == 'add-skill'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Parse Issue and Register Skill
        env:
          ISSUE_BODY: ${{ github.event.issue.body }}
        run: |
          python scripts/add_skill_from_issue.py

      - name: Auto-Sync Skills Catalog
        run: |
          python scripts/sync_skills.py

      - name: Commit and Push Update
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          git add sources.json skills.json README.md
          git commit -m "feat(skills): add skill from issue #${{ github.event.issue.number }} [skip ci]"
          git push

      - name: Comment and Close Issue
        uses: actions/github-script@v7
        with:
          script: |
            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: '🎉 شكراً لمساهمتك! تم التحقق من المهارة وإضافتها تلقائياً إلى الفهرس و `skills.json`.\n\nThank you! Your skill has been automatically verified and added to the catalog.'
            });
            github.rest.issues.update({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: 'closed'
            });
